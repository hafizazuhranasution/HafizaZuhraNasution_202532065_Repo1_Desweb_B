<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panduan Kaktus dan Sukulen - Kontak</title>
</head>

<body>

    <header>
        <h1>Konsultasi Tanaman</h1>
        <p>Punya masalah dengan kaktusmu? Tanyakan di sini</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="artikel.html">Artikel</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Formulir Konsultasi</h2>
            <form action="#" method="post">

                <p>
                    <label for="nama">Nama Lengkap:</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="jumlah">Jumlah Tanaman yang Dimiliki:</label><br>
                    <input type="number" id="jumlah" name="jumlah" min="1" max="100" required>
                </p>

                <fieldset>
                    <legend>Jenis Tanaman</legend>
                    <input type="radio" id="kaktus" name="jenis" value="kaktus" required>
                    <label for="kaktus">Kaktus</label><br>
                    <input type="radio" id="sukulen" name="jenis" value="sukulen">
                    <label for="sukulen">Sukulen</label><br>
                    <input type="radio" id="keduanya" name="jenis" value="keduanya">
                    <label for="keduanya">Keduanya</label>
                </fieldset>

                <fieldset>
                    <legend>Masalah yang Dialami</legend>
                    <input type="checkbox" id="busuk" name="masalah" value="busuk">
                    <label for="busuk">Batang atau akar busuk</label><br>
                    <input type="checkbox" id="layu" name="masalah" value="layu">
                    <label for="layu">Tanaman layu</label><br>
                    <input type="checkbox" id="hama" name="masalah" value="hama">
                    <label for="hama">Ada hama</label>
                </fieldset>

                <p>
                    <label for="pesan">Ceritakan Kondisi Tanamanmu:</label><br>
                    <textarea id="pesan" name="pesan" rows="4" cols="40"></textarea>
                </p>

                <button type="submit">Kirim Konsultasi</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Panduan Kaktus dan Sukulen. Dibuat untuk Praktikum Desain Web.</p>
    </footer>

</body>

</html>
